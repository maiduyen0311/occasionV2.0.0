<!doctype html>
<html><head><meta charset="utf-8">
<!-- 590 × 300 ThemeForest inline preview (01_preview.jpg). Logo = snippets/logo-occasion.liquid (copied inline);
     screenshots = page-intro/images. Claims only what the package ships (no rankings, no price). -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 590px; height: 300px; overflow: hidden; }
  * { box-sizing: border-box; }
  .p { position: relative; width: 590px; height: 300px; overflow: hidden; color: #d9d3cc; font-family: Poppins, Arial, sans-serif;
       background: radial-gradient(60% 80% at 0% 0%, rgba(251,148,85,.35), transparent 70%), radial-gradient(50% 70% at 100% 100%, rgba(187,216,178,.25), transparent 70%), #33302b; }
  .logo { position: absolute; left: 28px; top: 30px; width: 170px; height: auto; }
  .new { position: absolute; left: 28px; top: 70px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 30px;
         background: rgba(255,255,255,.1); font-size: 9.5px; color: #fff; }
  .new b { padding: 1px 7px; border-radius: 30px; background: #fb9455; font-size: 8.5px; letter-spacing: .06em; }
  h1 { position: absolute; left: 28px; top: 98px; margin: 0; width: 290px; color: #fff; font-size: 21px; line-height: 1.15; font-weight: 700; letter-spacing: -.5px; }
  h1 span { color: #fb9455; }
  .lead { position: absolute; left: 28px; top: 156px; width: 250px; margin: 0; font-size: 11px; line-height: 1.5; }
  .chips { position: absolute; left: 28px; bottom: 28px; display: flex; flex-wrap: wrap; gap: 6px; width: 270px; }
  .chips span { padding: 4px 9px; border-radius: 30px; border: 1px solid rgba(255,255,255,.2); font-size: 9.5px; color: #fff; }
  .chips span:first-child { background: #fb9455; border-color: #fb9455; }
  .stage { position: absolute; right: -10px; top: 26px; width: 300px; height: 270px; }
  .f { position: absolute; width: 170px; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 16px 34px -10px rgba(0,0,0,.6); }
  .f i { display: block; height: 12px; background: #f4efea; }
  .f img { display: block; width: 100%; height: 210px; object-fit: cover; object-position: top; }
  .f1 { left: 0; top: 34px; transform: rotate(-6deg); }
  .f3 { right: 0; top: 34px; transform: rotate(6deg); }
  .f2 { left: 62px; top: 0; z-index: 2; width: 180px; }
  .f2 img { height: 250px; }
  .num { position: absolute; right: 16px; bottom: 12px; z-index: 3; padding: 6px 10px; border-radius: 8px; background: #fff; color: #33302b; font-size: 9px; font-weight: 600; line-height: 1.2; text-align: center; box-shadow: 0 8px 20px -6px rgba(0,0,0,.5); }
  .num b { display: block; color: #fb9455; font-size: 22px; line-height: 1; }
</style></head>
<body><div class="p">
  <svg class="logo" viewBox="0 0 160 26" fill="none" stroke-width="1.7" aria-label="Occasion">
    <g stroke="#fb9455"><path d="M10 2.05A10.5 10.5 0 0 0 10 22.95"/><path d="M13 2.05A10.5 10.5 0 0 1 13 22.95"/></g>
    <g stroke="#bbd8b2"><path d="M44.4 5.1A10.5 10.5 0 1 0 44.4 19.9"/><path d="M67.4 5.1A10.5 10.5 0 1 0 67.4 19.9"/></g>
    <g stroke="#ffffff"><path d="M70.5 23.5L79.5 1.6L88.5 23.5"/><path d="M101.5 4.6C99.9 2.6 97.6 1.8 95.4 1.8C92.4 1.8 90.2 3.8 90.2 6.6C90.2 13.2 102 11.4 102 18.2C102 21.4 99.4 23.4 96.1 23.4C93.4 23.4 91 22.1 89.8 19.9"/><path d="M108.2 1.6V23.5"/><path d="M123 2.05A10.5 10.5 0 0 0 123 22.95"/><path d="M126 2.05A10.5 10.5 0 0 1 126 22.95"/><path d="M140.5 23.5V1.6L157.5 23.5V1.6"/></g>
  </svg>
  <div class="new"><b>2.0 UPDATE</b>Fully rebuilt · free for 1.x buyers</div>
  <h1>Multipurpose Shopify Theme <span>OS 2.0</span></h1>
  <p class="lead">Multi-category and fashion store designs with mega menus, daily deals, quick view, wishlist and compare built in.</p>
  <div class="chips"><span>3 store designs</span><span>80+ sections</span><span>No apps needed</span><span>31 languages</span></div>
  <div class="stage">
    <div class="f f1"><i></i><img src="../../page-intro/images/demo-fashion1-full.jpg" alt=""></div>
    <div class="f f3"><i></i><img src="../../page-intro/images/demo-fashion2-full.jpg" alt=""></div>
    <div class="f f2"><i></i><img src="../../page-intro/images/demo-occasion-full.jpg" alt=""></div>
    <div class="num"><b>3</b>STORE<br>DESIGNS</div>
  </div>
</div></body></html>
