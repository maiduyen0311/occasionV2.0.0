<!doctype html>
<html><head><meta charset="utf-8">
<!-- 80 × 80 ThemeForest thumbnail: the split "O" and the "C" of the Occasion wordmark
     (snippets/logo-occasion.liquid) as a monogram, with a "2.0" corner. -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 80px; height: 80px; overflow: hidden; }
  .t { position: relative; width: 80px; height: 80px; overflow: hidden; background: radial-gradient(90% 90% at 20% 10%, #4a453e 0%, #33302b 60%, #26231f 100%);
       display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-family: Poppins, Arial, sans-serif; }
  .t::after { content: ""; position: absolute; right: -18px; bottom: -18px; width: 54px; height: 54px; border-radius: 50%; background: rgba(251,148,85,.25); }
  .mono { position: relative; z-index: 1; width: 50px; height: auto; margin-top: 4px; }
  .sub { position: relative; z-index: 1; color: #fff; font-size: 7px; font-weight: 600; letter-spacing: 1.6px; }
  .v { position: absolute; z-index: 1; right: 4px; top: 4px; padding: 1px 4px; border-radius: 4px; background: #fb9455; color: #fff; font: 700 8px/1.3 Poppins, Arial, sans-serif; }
</style></head>
<body><div class="t">
  <svg class="mono" viewBox="-1 0 70 25" fill="none" stroke-width="3" aria-hidden="true">
    <g stroke="#fb9455"><path d="M10 2.05A10.5 10.5 0 0 0 10 22.95"/><path d="M13 2.05A10.5 10.5 0 0 1 13 22.95"/></g>
    <g stroke="#bbd8b2"><path d="M44.4 5.1A10.5 10.5 0 1 0 44.4 19.9"/><path d="M67.4 5.1A10.5 10.5 0 1 0 67.4 19.9"/></g>
  </svg>
  <div class="sub">OCCASION</div>
  <b class="v">2.0</b>
</div></body></html>
